name: Windows build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Package
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          if (-not $v -or '${{ github.ref_type }}' -ne 'tag') { $v = 'dev' }
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "tvflow-$v-windows-x64-portable.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: TVflow-Windows
          path: tvflow-*-windows-x64-portable.zip
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" tvflow-*-windows-x64-portable.zip --clobber
